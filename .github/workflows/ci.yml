name: CI

# Runs the unit tests (including the Robolectric test) and builds the debug
# and release APKs (the release build is the R8 check: it is unsigned in
# CI, which has no release keystore). The repo ships no Gradle wrapper,
# so Gradle is installed by gradle/actions/setup-gradle instead of
# ./gradlew.
on:
  push:
    branches: [main, fix/correctness-phase-1, fix/post-phase3-batch, fix/audit-builds]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 21, not 17: Robolectric's Android SDK 36 sandbox requires
      # Java 21 ("Android SDK 36 requires Java 21 (have Java 17)").
      # AGP 9.1.1 and Gradle 9.3.1 both run fine on 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The ubuntu runner already ships an Android SDK (ANDROID_HOME is set
      # by the image). Do NOT use android-actions/setup-android: v3 runs
      # `sdkmanager tools`, and the legacy `tools` package no longer exists,
      # so the step fails with exit code 1. Install what the build needs
      # directly, answering the license prompts (including the Android 36
      # preview license) non-interactively with `yes`.
      - name: Install Android platform and build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # The debug signing config points at ${rootDir}/debug.keystore, which
      # is not committed. Generate a throwaway debug keystore for CI only.
      - name: Generate debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Unit tests, debug and release builds
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/test-results/testDebugUnitTest/

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/
