name: Release

# Tags only: pushing a v* tag builds the SIGNED arm64-only release APK
# (the keystore is restored from the AURA_KEYSTORE_BASE64 secret and the
# signing passwords arrive via the AURA_KEYSTORE_PASSWORD /
# AURA_KEY_ALIAS / AURA_KEY_PASSWORD secrets), verifies its signature
# and version, creates the GitHub release for the tag from
# RELEASE_NOTES.md, and attaches the signed APK. The release is never
# a draft and never a prerelease. This job does NOT run on branch
# pushes — branch builds (unsigned R8 check) are the CI job's, and
# the release is never created from an unverified build: the APK is
# verified (apksigner + version) in this job before the release step.
#
# The signed release APK will NOT install over a debug build (different
# signing key) — uninstall first wipes app data, including places and
# settings; places are re-added afterwards.
on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: ubuntu-latest
    # The workflow-level default is contents: read; this job needs
    # write to create the release and upload the asset.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # JDK 21, not 17: Robolectric's Android SDK 36 sandbox requires
      # Java 21 ("Android SDK 36 requires Java 21 (have Java 17)").
      # AGP 9.1.1 and Gradle 9.3.1 both run fine on 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The ubuntu runner already ships an Android SDK (ANDROID_HOME is set
      # by the image). Do NOT use android-actions/setup-android: v3 runs
      # `sdkmanager tools`, and the legacy `tools` package no longer exists,
      # so the step fails with exit code 1. Install what the build needs
      # directly, answering the license prompts (including the Android 36
      # preview license) non-interactively with `yes`.
      - name: Install Android platform and build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # The debug signing config points at ${rootDir}/debug.keystore, which
      # is not committed. Generate a throwaway debug keystore for CI only.
      - name: Generate debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Restore release keystore
        run: |
          set -euo pipefail
          # The keystore itself is never in the repo: it arrives
          # base64-encoded in the AURA_KEYSTORE_BASE64 secret and is
          # written to the runner's temp dir, which is wiped with the
          # runner. The signing config reads it through
          # AURA_KEYSTORE_PATH (see app/build.gradle.kts).
          echo "$AURA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/auraweather-release.jks"
          echo "AURA_KEYSTORE_PATH=$RUNNER_TEMP/auraweather-release.jks" >> "$GITHUB_ENV"
        env:
          AURA_KEYSTORE_BASE64: ${{ secrets.AURA_KEYSTORE_BASE64 }}

      - name: Unit tests and signed release build
        run: gradle :app:testDebugUnitTest :app:assembleRelease --stacktrace
        env:
          AURA_KEYSTORE_PASSWORD: ${{ secrets.AURA_KEYSTORE_PASSWORD }}
          AURA_KEY_ALIAS: ${{ secrets.AURA_KEY_ALIAS }}
          AURA_KEY_PASSWORD: ${{ secrets.AURA_KEY_PASSWORD }}

      - name: Verify release APK signature and version
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-arm64-v8a-release.apk
          [ -s "$APK" ] || { echo "release APK missing or empty: $APK"; ls -l app/build/outputs/apk/release/; exit 1; }
          echo "release APK: $APK ($(stat -c%s "$APK") bytes)"
          APKSIGNER=$(ls "$ANDROID_HOME/build-tools/"*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          # The tag and the version must agree: the versionName in
          # build.gradle.kts must equal the tag minus its leading
          # 'v', and the versionCode must be above the last shipped
          # debug builds (code 4).
          AAPT=$(ls "$ANDROID_HOME/build-tools/"*/aapt2 | sort -V | tail -1)
          BADGING=$("$AAPT" dump badging "$APK" | head -1)
          echo "$BADGING"
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          TAG_NAME="${GITHUB_REF#refs/tags/v}"
          [ "$VERSION_NAME" = "$TAG_NAME" ] || {
            echo "tag $TAG_NAME != versionName $VERSION_NAME"
            exit 1
          }
          [ "$VERSION_CODE" -gt 4 ] || {
            echo "versionCode must be above the last shipped debug builds (4): $VERSION_CODE"
            exit 1
          }
          echo "$BADGING" | grep -q "name='com.docbobert6.auraweather' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" || {
            echo "release APK is not $VERSION_NAME / versionCode $VERSION_CODE: $BADGING"
            exit 1
          }
          echo "release APK verified: signed, com.docbobert6.auraweather $VERSION_NAME/code $VERSION_CODE"

      - name: Create release and attach APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          APK_SRC=app/build/outputs/apk/release/app-arm64-v8a-release.apk
          [ -s "$APK_SRC" ] || {
            echo "release APK is empty: $APK_SRC"
            exit 1
          }
          # A descriptive asset name: the raw Gradle output is
          # app-arm64-v8a-release.apk. Same bytes, so the SHA-256 is
          # unchanged.
          APK="aura-weather-$TAG-arm64-v8a.apk"
          cp "$APK_SRC" "$APK"
          SIZE=$(stat -c%s "$APK")
          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "attaching $APK ($SIZE bytes, sha256 $SHA256) to release $TAG"
          # Final notes: the repo's RELEASE_NOTES.md plus a Build
          # section carrying the exact bytes of the file being
          # attached, so the release page shows the size and SHA-256.
          {
            cat RELEASE_NOTES.md
            echo ""
            echo "- Tag $TAG, commit $GITHUB_SHA; workflow run $GITHUB_RUN_ID."
            echo "- Signed release APK: $APK, $SIZE bytes, SHA-256: \`$SHA256\`."
            echo "- Signed with the Aura Weather release key; signature and version verified by the release job (apksigner v2)."
          } > release-notes-final.md
          # A re-run of the tag workflow must not fail here: create
          # only when missing — refreshing the notes in either case,
          # since the notes file is the source of truth — then upload
          # with --clobber so a stale asset is replaced rather than
          # erroring. gh release create with no --draft / --prerelease
          # flags creates a normal published release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — refreshing its notes and uploading the asset"
            gh release edit "$TAG" --notes-file release-notes-final.md
          else
            gh release create "$TAG" --title "Aura Weather $TAG" --notes-file release-notes-final.md
          fi
          gh release upload "$TAG" "$APK" --clobber
          echo "release $TAG now carries:"
          gh release view "$TAG" --json assets --jq '.assets[].name'
